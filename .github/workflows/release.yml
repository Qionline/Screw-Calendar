name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Read project metadata
        shell: pwsh
        run: |
          $runtimeIdentifier = dotnet msbuild .\ScrewCalendar.csproj -getProperty:RuntimeIdentifier
          if ([string]::IsNullOrWhiteSpace($runtimeIdentifier)) { throw "RuntimeIdentifier is not configured." }
          "RUNTIME_IDENTIFIER=$runtimeIdentifier" >> $env:GITHUB_ENV

      - name: Verify tag and project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\ScrewCalendar.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match project version $version. Expected $expectedTag."
          }

      - name: Verify release commit belongs to main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit contained in origin/main."
          }

      - name: Restore
        run: dotnet restore .\ScrewCalendar.sln --configfile .\NuGet.Config --locked-mode

      - name: Test
        run: dotnet run --project .\tests\ScrewCalendar.Tests\ScrewCalendar.Tests.csproj -c Release --no-restore

      - name: Verify formatting
        run: dotnet format .\ScrewCalendar.sln --verify-no-changes --no-restore

      - name: Publish
        run: dotnet publish .\ScrewCalendar.csproj -c Release --no-restore -o .\artifacts\publish

      - name: Package and checksum
        shell: pwsh
        run: |
          $required = @(
            '.\artifacts\publish\ScrewCalendar.exe',
            '.\artifacts\publish\LICENSE',
            '.\artifacts\publish\README.md',
            '.\artifacts\publish\THIRD_PARTY_NOTICES.md'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing publish files: $($missing -join ', ')" }
          $archive = ".\artifacts\ScrewCalendar-${{ github.ref_name }}-${{ env.RUNTIME_IDENTIFIER }}.zip"
          Compress-Archive -Path .\artifacts\publish\* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\artifacts\ScrewCalendar-${{ github.ref_name }}-${{ env.RUNTIME_IDENTIFIER }}.zip" `
            ".\artifacts\ScrewCalendar-${{ github.ref_name }}-${{ env.RUNTIME_IDENTIFIER }}.zip.sha256" `
            --verify-tag `
            --generate-notes `
            --title "Screw Calendar ${{ github.ref_name }}"
